<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage 803 Racing</title>
    <meta property="og:image" content="http://garage803racing.org/images/preview-image.jpg">
    <link rel="icon" type="image/x-icon" href="images/browser-site-icon.png">
    <link rel = "stylesheet" href = "dropdown.css">
    <link rel = "stylesheet" href = "navbar.css">
    <link rel = "stylesheet" href = "footer.css">
</head>
<style>
    @keyframes slide-from-left{
        from{
            transform: translateX(-100%);
        }
    }
     @keyframes slide-from-right{
        from{
            transform: translateX(100%);
        }
    }
    @font-face{
        font-family: milker;
        src: url("fonts/Milker.otf")
    }
    html{
        overscroll-behavior: none;
    }
    body{
        background-image: url("images/mako-sunset.jpg");
        background-size: cover;
        background-position: 25% 100%;
    }
    main{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-self: center;
    }
    .our-cars-wrapper{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        margin-top: 10vw;
    }
    .car-card{
        width: clamp(250px,40vw,1000px);
        margin: 2em;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgb(250, 217, 168);
        border-radius: 0.5em;
        padding: 2em;
    }
    .car-card h1{
        font-family: milker;
        letter-spacing: 1px;
        font-size: clamp(30px,2vw,60px);
    }
    .car-card span{
        font-family: milker;
        letter-spacing: 0.5px;
    }
    .car-card p{
        font-weight: 500;
        margin: 0.25em;
        font-size: clamp(15px,1vw,30px);
    }
    .car-card img{
        width: 100%;
        border-radius: 0.25em;
    }
    @media(max-width: 768px){
        .car-card{
             width: clamp(250px,80vw,1000px);
        }
        .our-cars-wrapper{
             margin-top: 15vw;
        }
    }
    @media(min-width: 768px){
        .car-left{
            animation: slide-from-left 1.1s ease;
        }
        .car-right{
            animation: slide-from-right 1.1s ease;
        }
    }
</style>
<body style = "margin: 0; font-family: sf-pro;">
    <!-- Inner HTML in navbar.js-->
    <div class = "navigation" id = "navbar">
    </div>
    <main>
        <section class = "our-cars-wrapper">
            <div class = "car-card car-left">
                <img src = "images/2026-car.jpg">
                <h1>Mako</h1>
                <p><span>Year: </span>2026</p>
                <p><span>Division: </span>Advanced</p>
                <p><span>Distance Driven: </span>110.9 km</p>
                <p><span>Top Speed: </span>95 km/h</p>
            </div>
            <div class = "car-card car-right">
                <img src = "images/2025-car.jpg">
                <h1>DNF</h1>
                <p><span>Year: </span>2025</p>
                <p><span>Division: </span>Classic</p>
                <p><span>Distance Driven: </span>922.0 km</p>
                <p><span>Top Speed: </span>65 km/h</p>
            </div>
        </section>
    </main>
    <!-- Inner HTML in footer.js -->
     <footer id = "footer" style = "background-color: rgb(224, 224, 224);">
        
    </footer>
</body>
<script src = "navbar.js"></script>
<script src = "footer.js"></script>
</html>
