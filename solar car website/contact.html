<style>
    @keyframes fadeInUp{
        from{
            transform: translateY(1vw);
            opacity: 0;
        }
        to{
            transform: translateY(0vw);
            opacity:1;
        }
    }
    /* Custom Fonts*/
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Semibold.otf");
        font-weight: 500;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Regular.otf");
        font-weight: 400;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Thin.otf");
        font-weight: 300;
    }
    body{
        margin: 0;
        font-family: sf-pro;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-color: rgb(224, 224, 224);
        overflow-x: hidden; 
        overscroll-behavior: none;
    }
    body.dark{
        filter: brightness(50%);
    }
    .heroBanner{
        display: flex;
        background-image: url("site-banners/image3.jpg");
        background-size: cover;
        background-position: center bottom;
        background-attachment: fixed;
        align-items: center;
        justify-content: center;
    }
    .siteTopic{
        background-color: white;
        animation: fadeInUp 1s forwards;
    }
    .siteTopic p{
        font-weight: lighter;
    }
    .mainContent{
        flex: 1;
    }
    li{
        list-style-type: none;
    }
    
    /* Phone */
    @media(max-width: 770px){

        .siteTopic{
            border-radius: 2vw;
            width: 75%;
            align-content: center;
        }
        .siteTopic h1{
            font-size: 10vw;
            margin: 0;
            padding-top: 3vw;
            padding-left: 3vw;
            padding-right: 3vw;
            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 1vw;
            text-underline-offset: 2vw;
        }
        .siteTopic p{
            font-size: 3vw;
            padding-bottom: 3vw;
            padding-left: 3vw;
            padding-right: 3vw;
            text-align: center;
            margin: 2vw;
        }
        .heroBanner{
            aspect-ratio: 3/2;
            justify-content: center;
            margin-top: 12vw;
        }
        .siteTopic .contactInfo{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .siteTopic .icons{
            display: flex;
            align-items: center;
            margin: 2vw;
        }
        .siteTopic .icons img{
            width: 5vw;
            margin: 1vw;
        }
        
    }
    /* Computer */
    @media(min-width: 771px){
        .siteTopic{
            margin-top: 5vw;
            margin-bottom: 5vw;
            border-radius: 1vw;
            width: 75%;
        }
        .siteTopic h1{
            font-size: 8vw;
            margin: 0;
            padding-top: 5vw;
            text-decoration: underline;
            text-decoration-thickness: 0.5vw;
            text-underline-offset: 1vw;
            text-align: center;
        }
        .siteTopic p{
            font-size: 1.5vw;
            padding-bottom: 1.5vw;
            padding-left: 1.5vw;
            padding-right: 1.5vw;
            margin: 1vw;
            border-left: 0.25vw solid black;
        }
        .siteTopic .contactInfo{
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        .siteTopic .icons{
            display: flex;
        }
        .contactInfo{
            padding-bottom: 5vw;
        }
        .contactInfo a{
            align-content: center;
        }
        .siteTopic .icons img{
            width: 5vw;
            margin: 1vw;
            align-self: center;
        }
        .siteTopic .icons img:hover{
            transform: translateY(-0.5vw);
        }
        .heroBanner{
            margin-top: 6vw;
            display: flex;
            justify-content: center;
        }
    }
</style>

                <p>garage803racing@gmail.com<br><br>
                (650)-602-3303<br><br>
                Mountain View, CA 94040</p>
            </div>
        </div>
    </div>
        <!-- Footer -->
    <footer id = "footer" style = "background-color: rgb(224, 224, 224); display: flex; flex-direction: column;">
