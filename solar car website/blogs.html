<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage 803 Racing</title>
    <meta property="og:image" content="http://garage803racing.org/images/preview-image.jpg">
    <link rel="icon" type="image/x-icon" href="images/browser-site-icon.png">
    <link rel = "stylesheet" href = "dropdown.css">
    <link rel = "stylesheet" href = "navbar.css">
    <link rel = "stylesheet" href = "footer.css">
</head>
<style>
    @keyframes fade-to-black{
        0%, 50%{
            opacity: 0;
        }
    }
    @keyframes fade-in-text{
        0%, 50%{
            opacity: 0;
            transform: translateY(50px);
        }
    }
    html{
        overscroll-behavior-y: none;
    }
    main{
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow-x: hidden;
        min-height: 100vh;
        margin-top: 15vw;
        margin-left: 5vw;
        margin-right: 5vw;
        margin-bottom: 5vw;
    }
    video{
        width: 100%;
        height: 100%;
        margin: 0;
        object-fit:cover;
    }
    .blackDiv{
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background-color: rgba(0,0,0,0.5);
        animation: fade-to-black 2.5s ease-in-out;
    }
    footer{
        position: relative;
    }
    .navigation{
        z-index: 900;
    }
    .videoBackground{
        width: 100vw;
        height: 100vh;
        z-index: -1;
        position: fixed;
    }
    .title{
        color: white;
        font-weight: 100;
        font-size: 4vw;
        animation: fade-in-text 5s forwards;
        margin: 0;
    }
    .subtitle{
        color: white;
        font-weight: 100;
        font-size: 2vw;
        margin-top: 30px;
        animation: fade-in-text 5s forwards;
        margin: 0;
    }
</style>
<body style = "margin: 0; font-family: sf-pro; display: flex; flex-direction: column;">
    <!-- Inner HTML in navbar.js-->
     <div class = "videoBackground">
        <video autoplay muted loop playsinline>
        <source src="videos/racetrack vid 2.mp4" type="video/mp4">
        </video>
        <div class = "blackDiv"></div>
    </div>
    <div class = "navigation" id = "navbar">
    </div>
    <main>
        <h1 class = "title">Building our car, one weld at a time.</h1>
        <p class = "subtitle">Garage 803 Racing</p>
    </main>

    <!-- Inner HTML in footer.js -->
     <footer id = "footer" style = "background-color: rgb(224, 224, 224); display: flex; flex-direction: column;">
        
    </footer>
</body>
<script src = "navbar.js"></script>
<script src = "footer.js"></script>
</html>
