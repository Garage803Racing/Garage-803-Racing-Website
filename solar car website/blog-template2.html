<style>
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Semibold.otf");
        font-weight: 500;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Regular.otf");
        font-weight: 400;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Thin.otf");
        font-weight: 300;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Heavy.otf");
        font-weight: 600;
    }
    @keyframes fade-in{
        from{
            opacity: 0;
        }
    }
    html{
        overscroll-behavior-y: none;
    }
    main{
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }
    .blogContent{
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        margin-top: 10vw;
        margin-bottom: 5em;
        width: clamp(250px,90vw,1200px);
        animation: fade-in 2.5s forwards;
    }
    .blogTitle{
        font-family: sf-pro;
        font-weight: 300;
        margin-bottom: 0;
        font-size: clamp(40px,5vw,65px);
    }
    .blogDate{
        font-family: sf-pro;
        font-weight: 300;
        margin-top: 0;
        font-size: clamp(15px,2vw,40px);
    }
    .blogMedia{
        width: clamp(250px,35vw,1500px);
        margin: 1em;
    }
    .blogDescription{
        font-family: sf-pro;
        font-weight: 300;
        font-size: clamp(13px,1.5vw,20px);
        width: 100%;
        background-color: rgb(176, 231, 245);
        padding: 1em;
        box-sizing: border-box;
        margin-bottom: 0.5em;
    }
    .blogMediaGallery{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
    }
    @media(max-width: 768px){
        .blogContent{
            margin-top: 15vw;
        }
    }
</style>
<body style = "margin: 0; font-family: sf-pro;">
    <!-- Inner HTML in navbar.js-->
    <div class = "navigation" id = "navbar">
    </div>
    <main>
        <div class = "blogContent">
            <h1 class = "blogTitle">Blog Title</h1>
            <h2 class = "blogDate">mm/dd/yyyy</h2>
            <div class = "blogMediaGallery">
                 <img class = "blogMedia" src = "">
                <img class = "blogMedia" src = "">
            </div>
            <p class = "blogDescription"></p>
        </div>
    </main>
    <!-- Inner HTML in footer.js -->
     <footer id = "footer" style = "background-color: rgb(224, 224, 224);">
        
    </footer>
</body>
<script src = "navbar.js"></script>
<script src = "footer.js"></script>
</html>
