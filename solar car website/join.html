<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Garage 803 Racing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:site_name" content="Garage 803 Racing" />
    <meta property="og:title" content="Garage 803 Racing" />
    <meta property="twitter:title" content="Garage 803 Racing" />
    <meta property="og:url" content="http://garage803racing.org/" />
    <meta property="og:type" content="website">
    <meta property="og:description" content="Welcome to Garage 803 Racing Solar Car Team!"/>
    
    <meta property="og:image:secure_url" content="http://garage803racing.org/images/preview-image.jpg"/>
    <meta property="twitter:image" content="http://garage803racing.org/images/preview-image.jpg"/>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description" content="Welcome to Garage 803 Racing Solar Car Team!">

    <meta property="og:image" content="http://garage803racing.org/images/preview-image.jpg">
    <link rel="icon" type="image/x-icon" href="images/browser-site-icon.png">
    <link rel = "stylesheet" href = "dropdown.css">
     <link rel = "stylesheet" href = "navbar.css">
     <link rel = "stylesheet" href = "footer.css">
</head>
<style>
    /* Keyframe for fade-in-up animation */
    @keyframes fadeInUp{
        from{
            transform: translateY(1vw);
            opacity: 0;
        }
        to{
            transform: translateY(0vw);
            opacity:1;
        }
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Semibold.otf");
        font-weight: 500;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Regular.otf");
        font-weight: 400;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Thin.otf");
        font-weight: 300;
    }
    /* Basic body styling */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden; /* Prevent horizontal scrolling on the body */
    }
    body{
        font-family: sf-pro;
        display: flex;
        flex-direction: column;
        min-height: 100vh; /* Ensures footer is at the bottom */
        background-color: white;
    }    
    /* Hero banner styling */
    .heroBanner{
        display: flex;
        background-image: url("site-banners/image7.jpg");
        background-size: cover;
        background-position: center bottom;
        background-attachment: fixed;
        align-items: center;
        justify-content: center;
    }
    /* Title box styling */
    .siteTopic{
        background-color: white;
        animation: fadeInUp 1s forwards;
    }
    .siteTopic p{
        font-weight: lighter;
        text-align: center;
    }
    .siteTopic h1{
        text-align: center;
    }
    /* Main content area */
    .mainContent{
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 4vw; 
        box-sizing: border-box;
    }
    /* Responsive container for the Google Form */
    .google-form-container {
        width: 100%;
        max-width: 800px; /* Adjust max-width as needed */
        height: 120vh; /* A good default height */
        border: 1px solid #ccc;
        border-radius: 1vw;
        overflow: hidden; /* Ensures the iframe stays within the border */
    }
    .google-form-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }
    li{
        list-style-type: none;
    }
    
    /* Phone specific styles */
    @media(max-width: 770px){
        .siteTopic{
            border-radius: 2vw;
            width: 75%;
        }
        .siteTopic h1{
            font-size: 16vw;
            margin: 0;
            padding-top: 3vw;
            padding-left: 3vw;
            padding-right: 3vw;
            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 1vw;
            text-underline-offset: 2vw;
        }
        .siteTopic p{
            font-size: 3vw;
            padding-bottom: 3vw;
            padding-left: 3vw;
            padding-right: 3vw;
            text-align: center;
            margin: 2vw;
        }
        .heroBanner{
            aspect-ratio: 2/1;
            margin-top: 12vw;
        }
        .mainContent {
            padding: 5vw;
        }
        .google-form-container {
            height: 150vh; /* Taller form for mobile */
            border-radius: 2vw; /* Rounded corners for mobile */
        }
    }
    /* Computer specific styles */
    @media(min-width: 771px){
        .siteTopic{
            border-radius: 1vw;
            width: 40%;
        }
        .siteTopic h1{
            font-size: 8vw;
            margin: 0;
            padding-top: 1.5vw;
            padding-left: 1.5vw;
            padding-right: 1.5vw;
            text-decoration: underline;
            text-decoration-thickness: 0.5vw;
            text-underline-offset: 1vw;
        }
        .siteTopic p{
            font-size: 1.5vw;
            padding-bottom: 1.5vw;
            padding-left: 1.5vw;
            padding-right: 1.5vw;
            margin: 1vw;
        }
        .heroBanner{
            aspect-ratio: 4/1;
            margin-top: 6vw;
        }
    }
</style>
<body>
    <!-- Navigation Bar. Inner HTML in navbar.js-->
    <div class = "navigation" id = "navbar"></div>

    <!-- Hero Banner -->
    <div class = "heroBanner">
        <div class = "siteTopic">
            <h1>JOIN US</h1>
            <p>Interested in being a part of the team? Fill out the form below to get started!</p>
        </div>
    </div>

    <!-- Main Content with Google Form -->
    <div class = "mainContent">
        <div class="google-form-container">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdtvcCUGSctIEfUPF6ntLFRTg2jaba3j591F7mQ5DIlA61DdA/viewform?embedded=true">Loading…</iframe>
        </div>
    </div>

    <!-- Footer -->
     <footer id = "footer" style = "background-color: rgb(224, 224, 224); display: flex; flex-direction: column;">
    
    </footer>
<body>
<script src = "navbar.js"></script>
<script src = "footer.js"></script>


</body>
</html>
