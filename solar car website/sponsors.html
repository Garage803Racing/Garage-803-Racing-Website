<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Garage 803 Racing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://garage803racing.org/images/preview-image.jpg">
    <link rel="icon" type="image/x-icon" href="images/browser-site-icon.png">
    <meta property="og:site_name" content="Garage 803 Racing" />
    <meta property="og:title" content="Garage 803 Racing - Sponsors ❤️" />
    <meta property="twitter:title" content="Garage 803 Racing - Sponsors ❤️" />
    <meta property="og:url" content="https://garage803racing.org/" />
    <meta property="og:type" content="website">
    <meta property="og:description" content="Interested in Sponsoring Garage 803 Racing? Check out our Sponsorship Package and Project Pitch Deck to see our cost breakdowns and the benefits you can recieve for your company."/>
    
    <meta property="og:image:secure_url" content="https://garage803racing.org/images/preview-image.jpg"/>
    <meta property="twitter:image" content="https://garage803racing.org/images/preview-image.jpg"/>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description" content="Interested in Sponsoring Garage 803 Racing? Check out our Sponsorship Package and Project Pitch Deck to see our cost breakdowns and the benefits you can recieve for your company.">
    <link rel = "stylesheet" href = "dropdown.css">
     <link rel = "stylesheet" href = "navbar.css">
     <link rel = "stylesheet" href = "footer.css">
</head>
<style>
    @keyframes fadeInUp{
        from{
            transform: translateY(1vw);
            opacity: 0;
        }
        to{
            transform: translateY(0vw);
            opacity:1;
        }
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Semibold.otf");
        font-weight: 500;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Regular.otf");
        font-weight: 400;
    }
    @font-face{
        font-family: sf-pro;
        src: url("fonts/SF-Pro-Display-Thin.otf");
        font-weight: 300;
    }
    body{
        margin: 0;
        font-family: sf-pro;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-color: white;
        width: 100vw;
        overflow-x: hidden;
        overscroll-behavior: none;
    }
    .heroBanner{
        display: flex;
        background-image: url("site-banners/image9.jpg");
        background-size: 100% 100%;
        background-position: center center;
        align-items: center;
    }
    .siteTopic{
        background-color: white;
        animation: fadeInUp 1s forwards;
        display: flex;
        flex-direction: column;
    }
    .siteTopic p{
        font-weight: lighter;
    }
    .mainContent{
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .bronze-sponsors{
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        width: 90%;
        margin-top: 50px;
        border: 2px solid rgb(255, 200, 163);
        border-radius: 10px;
    }
    .gold-sponsors{
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        width: 90%;
        margin-top: 50px;
        border: 2px solid rgb(242, 195, 87);
        border-radius: 10px;
    }
    .silver-sponsors{
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        width: 90%;
        margin-top: 50px;
        border: 2px solid rgb(160, 164, 182);
        border-radius: 10px;
    }
    .logo{
        width: clamp(150px,20vw,300px);
        margin: 25px;
        cursor: pointer;
        transition: transform 0.25s ease;
    }
    .logo:hover{
        transform: translateY(-0.5em);
    }
    .buttonQRcode{
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .buttonQRcode a{
        text-decoration: none;
        color: rgb(48, 48, 48);
    }
    li{
        list-style-type: none;
    }
    .gold-sponsors.hidden{
            display: none !important;
    }
    .bronze-sponsors.hidden{
        display: none !important;
    }
    .silver-sponsors.hidden{
        display: none !important;
    }
    .filter-buttons-container{
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        margin-top: 25px;
    }
    .sponsors-filter-button{
        cursor: pointer;
        background: none;
        width: clamp(200px,20vw,700px);
        margin: 20px;
        font-family: sf-pro;
        font-weight: 500;
        border-radius: 5px;
        font-size: 1.25em;
        transition: scale 0.25s ease;
        border: none !important;
    }
    .sponsors-filter-button:hover{
       scale: 1.05;
    }
    .all-sponsors-button{
        background-color: rgb(200, 198, 255);
    }
    .bronze-sponsors-button{
        background-color: rgb(255, 200, 163);
    }
    .gold-sponsors-button{
         background-color: rgb(242, 195, 87);
    }
    .silver-sponsors-button{
        background-color: rgb(224, 224, 224);
    }
    /* Phone */
    @media(max-width: 770px){
        .siteTopic{
            border-radius: 2vw;
            width: 75%;
        }
        .siteTopic h1{
            font-size: 12vw;
            margin: 0;
            padding-top: 3vw;
            padding-left: 3vw;
            padding-right: 3vw;
            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 1vw;
            text-underline-offset: 2vw;
        }
        .siteTopic p{
            font-size: 3vw;
            padding-bottom: 3vw;
            padding-left: 3vw;
            padding-right: 3vw;
            text-align: center;
            margin: 2vw;
        }
        .heroBanner{
            aspect-ratio: 2/1;
            justify-content: center;
            margin-top: 12vw;
        }
        .mainContent h1{
            font-size: 6vw;
        }
        .buttonQRcode button{
            width: 80vw;
            background-color: rgb(37,170,225);
            border-radius: 8vw;
            color: rgb(48, 48, 48);
            border: none;
            font-size: 6vw;
            font-weight: bolder;
            padding: 4vw;
            margin: 20px;
        }
        .buttonQRcode img{
            width: 60vw;
            margin: 8vw;
        }
        .filter-buttons-container{
            display: flex;
            flex-wrap: nowrap;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .filter-buttons-container{
            margin-top: 10px;
        }
        .sponsors-filter-button{
            margin: 5px;
        }
    }
    /* Computer */
    @media(min-width: 771px){

        .siteTopic{
            margin-left: 2vw;
            border-radius: 1vw;
            width: 50%;
        }
        .siteTopic h1{
            font-size: 8vw;
            margin: 0;
            padding-top: 1.5vw;
            padding-left: 1.5vw;
            padding-right: 1.5vw;
            text-decoration: underline;
            text-decoration-thickness: 0.5vw;
            text-underline-offset: 1vw;
        }
        .siteTopic p{
            font-size: 2vw;
            padding-bottom: 1.5vw;
            padding-left: 1.5vw;
            padding-right: 1.5vw;
            margin: 1vw;
        }
        .heroBanner{
            aspect-ratio: 4/1;
            margin-top: 6vw;
        }
        .mainContent h1{
            font-size: 3vw;
        }
        .sponsorsContent{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            margin-bottom: 4vw;
            margin-top: 4vw;
        }
        .buttonQRcode button{
            width: 40vw;
            background-color: rgb(37,170,225);
            border-radius: 4vw;
            color: rgb(48, 48, 48);
            border: none;
            font-size: 3vw;
            font-weight: bolder;
            padding: 2vw;
            margin: 20px;
            transition: transform 0.25s ease;
        }
        .buttonQRcode button:hover{
            cursor: pointer;
            transform: translateY(-0.5vw);
        }
        .buttonQRcode img{
            width: 25vw;
            margin: 4vw;
        }
    }
</style>
<body>
    <div class = "navigation" id = "navbar"></div> <!--- Keep this line, very important!-->
    <div class = "heroBanner">
        <div class = "siteTopic">
            <h1>SPONSORS</h1>
            <p>Garage 803 Racing is only possible thanks to the
            support of these sponsors.</p>            
        </div>
    </div>
    <div class = "mainContent">
        <div class = "filter-buttons-container">
            <button class = "all-sponsors-button sponsors-filter-button" onclick = "showAll()">All Sponsors</button>
            <button class = "gold-sponsors-button sponsors-filter-button" onclick = "showGold()">Gold Sponsors</button>
            <button class = "silver-sponsors-button sponsors-filter-button" onclick = "showSilver()">Silver Sponsors</button>
            <button class = "bronze-sponsors-button sponsors-filter-button" onclick = "showBronze()">Bronze Sponsors</button>
        </div>
        <div class = "gold-sponsors">
            <img class = "logo" src = "sponsor-logos/simscale.jpg" onclick = "location.assign('https://www.simscale.com')">
            <img class = "logo" src = "sponsor-logos/fpr-logo.png" onclick = "location.assign('https://www.fpr-newenergy.com/')">
            <img class = "logo" src = "sponsor-logos/d2-solar-logo.png" onclick = "location.assign('https://www.d2solar.com/')">
             <img class = "logo" src = "sponsor-logos/ace-fire-inc-logo.png" onclick = "location.assign('https://www.acefireinc.com/')">
        </div>
        <div class = "silver-sponsors">
            <img class = "logo" src = "sponsor-logos/evolution-motorcycles-logo.png" onclick = "location.assign('https://evolution-motorcycles.com/')">
            <img class = "logo" src = "sponsor-logos/bicycle-outfitter-logo.png" onclick = "location.assign('https://www.bicycleoutfitter.com/')">
        </div>
        <div class = "bronze-sponsors"> 
            <img class = "logo" src = "sponsor-logos/polycarbonate-depot-logo.jpg" onclick = "location.assign('https://polycarbonatedepot.com/')">
            <img class = "logo" src = "sponsor-logos/home-depot.jpg" onclick = "location.assign('https://www.homedepot.com/')">
            <img class = "logo" src = "sponsor-logos/lowes.png" onclick = "location.assign('https://www.lowes.com')">
            <img class = "logo"src = "sponsor-logos/panda-express.png" onclick = "location.assign('https://www.pandaexpress.com/')">
        </div>
        <h1 style = "text-align: center">Interested in supporting our team?</h1>
        <div class = "sponsorsContent">
            <div class = "buttonQRcode">
                <button onclick = "window.open('https://garage803racing.org/project_pitch.pdf','_blank');">Project Pitch</button>
                <!-- <img src = "images/qr2_Sponsors.png"> --->
            </div>
            <div class = "buttonQRcode">
                <button onclick = "window.open('https://garage803racing.org/sponsorship-package','_blank')">Sponsorship Proposal</button>
                
                <!-- <img src = "images/qr_Cost.png"> -->
            </div>
        </div>
    </div>
    <!-- Footer -->
     <footer id = "footer" style = "background-color: rgb(224, 224, 224); display: flex; flex-direction: column;">
    
    </footer>
</body>
<script>
    const goldSponsors = document.querySelector(".gold-sponsors");
    const bronzeSponsors = document.querySelector(".bronze-sponsors");
    const silverSponsors = document.querySelector(".silver-sponsors");

    function showAll(){
        goldSponsors.classList.remove("hidden");
        bronzeSponsors.classList.remove("hidden");
        silverSponsors.classList.remove("hidden");
    }
    function showGold(){
        goldSponsors.classList.remove("hidden");
        bronzeSponsors.classList.add("hidden");
        silverSponsors.classList.add("hidden");
    }
    function showBronze(){
        goldSponsors.classList.add("hidden");
        bronzeSponsors.classList.remove("hidden");
        silverSponsors.classList.add("hidden");
    }
    function showSilver(){
        silverSponsors.classList.remove("hidden");
        goldSponsors.classList.add("hidden");
        bronzeSponsors.classList.add("hidden");
    }
</script>
<script src = "navbar.js"></script>
<script src = "footer.js"></script>

</html>
